# Render asigna el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Base de datos en memoria (se reinicia en cada arranque)
spring.datasource.url=jdbc:h2:mem:estudiantesdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Orígenes permitidos para el frontend, separados por comas.
# En Render se define con la variable de entorno CORS_ORIGEN.
app.cors.origen=${CORS_ORIGEN:http://localhost:5173}
